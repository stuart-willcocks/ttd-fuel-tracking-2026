<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64x64.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0B0F19" />
    <meta name="application-name" content="TTD Stress Test Console" />
    <title>TTD Fuel Tracking — Stress Test Simulator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      html, body {
        width: 100%;
        max-width: 100%;
        margin: 0;
        padding: 0;
        background: #0B0F19;
        color: #F8FAFC;
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        overflow-x: hidden;
        box-sizing: border-box;
      }
      #stress-test-root {
        width: 100%;
        min-height: 100vh;
        min-height: 100dvh;
        box-sizing: border-box;
      }
      vercel-live-feedback,
      #vercel-live-feedback,
      iframe[src*="vercel.live"] {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
        pointer-events: none !important;
      }
    </style>
    <script>
      (function() {
        // Clean cache-busting ?v= parameter from URL bar after page load completes
        window.addEventListener('load', function() {
          try {
            if (window.location.search.indexOf('v=') !== -1) {
              var u = new URL(window.location.href);
              u.searchParams.delete('v');
              var q = u.searchParams.toString();
              window.history.replaceState({}, '', u.pathname + (q ? '?' + q : '') + u.hash);
            }
          } catch (e) {}
        });

        var hadControllerOnBoot = false;
        try {
          if ('serviceWorker' in navigator) {
            hadControllerOnBoot = Boolean(navigator.serviceWorker.controller);
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              return Promise.all(regs.map(function(r) { return r.unregister().catch(function() {}); }));
            }).then(function() {
              if ('caches' in window) {
                caches.keys().then(function(keys) {
                  keys.forEach(function(k) {
                    if (k.indexOf('ttd-hashed-assets-cache') !== -1 || k.indexOf('workbox') !== -1) {
                      caches.delete(k).catch(function() {});
                    }
                  });
                }).catch(function() {});
              }
            }).catch(function() {});
          }
        } catch (e) {}

        var triggerStressSelfHeal = function() {
          try {
            var lastHealTs = Number(sessionStorage.getItem('ttd_stress_sw_heal_ts') || '0');
            if (Date.now() - lastHealTs < 8000) return;
            sessionStorage.setItem('ttd_stress_sw_heal_ts', String(Date.now()));
          } catch (e) {}

          var finishReload = function() {
            var bust = new URL(window.location.origin + window.location.pathname + window.location.hash);
            bust.searchParams.set('v', String(Date.now()));
            window.location.replace(bust.toString());
          };

          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              return Promise.all(regs.map(function(r) { return r.unregister().catch(function() {}); }));
            }).then(function() {
              if ('caches' in window) {
                return caches.keys().then(function(keys) {
                  return Promise.all(keys.map(function(k) { return caches.delete(k).catch(function() {}); }));
                });
              }
            }).finally(finishReload);
          } else {
            finishReload();
          }
        };

        window.addEventListener('error', function(ev) {
          var t = ev && ev.target;
          if (t && (t.tagName === 'SCRIPT' || t.tagName === 'LINK')) {
            triggerStressSelfHeal();
          }
        }, true);

        window.addEventListener('unhandledrejection', function(ev) {
          var reason = ev && ev.reason ? String(ev.reason.message || ev.reason) : '';
          if (
            reason.indexOf('Failed to fetch dynamically imported module') !== -1 ||
            reason.indexOf('Importing a module script failed') !== -1 ||
            reason.indexOf('error loading dynamically imported module') !== -1
          ) {
            triggerStressSelfHeal();
          }
        });

        if (hadControllerOnBoot) {
          setTimeout(function() {
            var root = document.getElementById('stress-test-root');
            if (root && root.childNodes.length === 0) {
              triggerStressSelfHeal();
            }
          }, 3500);
        }
      })();
    </script>
  </head>
  <body>
    <div id="stress-test-root"></div>
    <script type="module" src="/src/stressTest/main.tsx"></script>
  </body>
</html>
