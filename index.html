<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function() {
        var isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini|Zebra|TC26/i.test(navigator.userAgent);
        if (!isMobile) {
          document.documentElement.classList.add('is-desktop-browser');
          var isDetached = window.name === 'TTD_PDA_WINDOW' || window.location.search.indexOf('pda_window=1') !== -1;
          if (!isDetached) {
            try {
              if (sessionStorage.getItem('ttd_stay_in_tab') !== '1') {
                var pdaUrl = new URL(window.location.href);
                pdaUrl.searchParams.set('pda_window', '1');
                var pop = window.open(
                  pdaUrl.toString(),
                  'TTD_PDA_WINDOW',
                  'width=430,height=800,menubar=no,toolbar=no,location=no,status=no,resizable=no,scrollbars=no'
                );
                if (pop && !pop.closed) {
                  window.__TTD_POPUP_LAUNCHED__ = true;
                }
              }
            } catch (e) {}
          }
        }
        // Clean cache-busting ?v= parameter from URL bar immediately on load
        try {
          if (window.location.search.indexOf('v=') !== -1) {
            var u = new URL(window.location.href);
            u.searchParams.delete('v');
            var q = u.searchParams.toString();
            window.history.replaceState({}, '', u.pathname + (q ? '?' + q : '') + u.hash);
          }
        } catch (e) {}
        // Suppress injected Vercel Toolbar / Live Feedback widget on preview/staging builds
        var removeVercelToolbar = function() {
          var els = document.querySelectorAll('vercel-live-feedback, #vercel-live-feedback, iframe[src*="vercel.live"], script[src*="vercel.live"]');
          for (var i = 0; i < els.length; i++) {
            if (els[i] && els[i].parentNode) els[i].parentNode.removeChild(els[i]);
          }
        };
        removeVercelToolbar();
        if (typeof MutationObserver !== 'undefined') {
          new MutationObserver(removeVercelToolbar).observe(document.documentElement, { childList: true, subtree: true });
        }
      })();
    </script>
    <style>
      vercel-live-feedback,
      #vercel-live-feedback,
      iframe[src*="vercel.live"] {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
        pointer-events: none !important;
      }
    </style>
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64x64.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#FFFFFF" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-touch-fullscreen" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="application-name" content="TTD Fuel" />
    <title>TTD Fuel Tracking — Zebra Handheld Fleet System</title>
    <!-- High-Visibility Typography: Inter, Barlow Semi Condensed & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
