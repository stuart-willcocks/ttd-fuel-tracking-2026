<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function() {
        var isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini|Zebra|TC26/i.test(navigator.userAgent);
        if (!isMobile) {
          document.documentElement.classList.add('is-desktop-browser');
          var isDetached = window.name === 'TTD_PDA_WINDOW' || window.location.search.indexOf('pda_window=1') !== -1;
          if (!isDetached) {
            try {
              if (sessionStorage.getItem('ttd_stay_in_tab') !== '1') {
                var pdaUrl = new URL(window.location.href);
                pdaUrl.searchParams.set('pda_window', '1');
                var pop = window.open(
                  pdaUrl.toString(),
                  'TTD_PDA_WINDOW',
                  'width=430,height=800,menubar=no,toolbar=no,location=no,status=no,resizable=no,scrollbars=no'
                );
                if (pop && !pop.closed) {
                  window.__TTD_POPUP_LAUNCHED__ = true;
                }
              }
            } catch (e) {}
          }
        }
      })();
    </script>
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64x64.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#1E222B" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-touch-fullscreen" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="application-name" content="TTD Fuel" />
    <title>TTD Fuel Tracking — Zebra Handheld Fleet System</title>
    <!-- High-Visibility Slate Typography: Inter & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
