<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64x64.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#FFFFFF" />
    <meta name="application-name" content="TTD Fuel Tracking" />
    <title>TTD Fuel Tracking — Admin Portal</title>
    <!-- High-Visibility Slate Typography: Inter, JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
      html, body {
        width: 100%;
        max-width: 100%;
        margin: 0;
        padding: 0;
        overflow-x: hidden;
        box-sizing: border-box;
      }
      #admin-root {
        width: 100%;
        max-width: 100%;
        min-height: 100vh;
        min-height: 100dvh;
        overflow-x: hidden;
        box-sizing: border-box;
      }
      /* Print styling for printing physical asset QR labels */
      @media print {
        body {
          background: #ffffff !important;
          color: #000000 !important;
        }
        .no-print {
          display: none !important;
        }
        .print-only {
          display: block !important;
        }
      }
      /* Suppress Vercel Toolbar / Live Feedback widget */
      vercel-live-feedback,
      #vercel-live-feedback,
      iframe[src*="vercel.live"] {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
        pointer-events: none !important;
      }
    </style>
    <script>
      (function() {
        var removeVercelToolbar = function() {
          var els = document.querySelectorAll('vercel-live-feedback, #vercel-live-feedback, iframe[src*="vercel.live"], script[src*="vercel.live"]');
          for (var i = 0; i < els.length; i++) {
            if (els[i] && els[i].parentNode) els[i].parentNode.removeChild(els[i]);
          }
        };
        removeVercelToolbar();
        if (typeof MutationObserver !== 'undefined') {
          new MutationObserver(removeVercelToolbar).observe(document.documentElement, { childList: true, subtree: true });
        }

        // Clean cache-busting ?v= parameter from URL bar immediately on load
        try {
          if (window.location.search.indexOf('v=') !== -1) {
            var u = new URL(window.location.href);
            u.searchParams.delete('v');
            var q = u.searchParams.toString();
            window.history.replaceState({}, '', u.pathname + (q ? '?' + q : '') + u.hash);
          }
        } catch (e) {}

        // Proactively unregister any PWA Service Workers on the desktop Admin Console
        // so stale Workbox precaches or runtime asset caches never block /admin chunks
        var hadControllerOnBoot = false;
        try {
          if ('serviceWorker' in navigator) {
            hadControllerOnBoot = Boolean(navigator.serviceWorker.controller);
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              return Promise.all(regs.map(function(r) { return r.unregister().catch(function() {}); }));
            }).then(function() {
              if ('caches' in window) {
                caches.keys().then(function(keys) {
                  keys.forEach(function(k) {
                    if (k.indexOf('ttd-hashed-assets-cache') !== -1) {
                      caches.delete(k).catch(function() {});
                    }
                  });
                }).catch(function() {});
              }
            }).catch(function() {});
          }
        } catch (e) {}

        var triggerAdminSelfHeal = function() {
          try {
            var lastHealTs = Number(sessionStorage.getItem('ttd_admin_sw_heal_ts') || '0');
            if (Date.now() - lastHealTs < 8000) return;
            sessionStorage.setItem('ttd_admin_sw_heal_ts', String(Date.now()));
          } catch (e) {}

          var finishReload = function() {
            var bust = new URL(window.location.origin + window.location.pathname + window.location.hash);
            bust.searchParams.set('v', String(Date.now()));
            window.location.replace(bust.toString());
          };

          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              return Promise.all(regs.map(function(r) { return r.unregister().catch(function() {}); }));
            }).then(function() {
              if ('caches' in window) {
                return caches.keys().then(function(keys) {
                  return Promise.all(keys.map(function(k) { return caches.delete(k).catch(function() {}); }));
                });
              }
            }).finally(finishReload);
          } else {
            finishReload();
          }
        };

        // Self-healing guard if a chunk fails to load or a Service Worker aborts a module script
        window.addEventListener('error', function(ev) {
          var t = ev && ev.target;
          if (t && (t.tagName === 'SCRIPT' || t.tagName === 'LINK')) {
            triggerAdminSelfHeal();
          }
        }, true);

        window.addEventListener('unhandledrejection', function(ev) {
          var reason = ev && ev.reason ? String(ev.reason.message || ev.reason) : '';
          if (
            reason.indexOf('Failed to fetch dynamically imported module') !== -1 ||
            reason.indexOf('Importing a module script failed') !== -1 ||
            reason.indexOf('error loading dynamically imported module') !== -1
          ) {
            triggerAdminSelfHeal();
          }
        });

        // Watchdog: if a Service Worker was controlling the page on boot and #admin-root is still empty after 3.5s, heal & reload
        if (hadControllerOnBoot) {
          setTimeout(function() {
            var root = document.getElementById('admin-root');
            if (root && root.childNodes.length === 0) {
              triggerAdminSelfHeal();
            }
          }, 3500);
        }
      })();
    </script>
  </head>
  <body>
    <div id="admin-root"></div>
    <script type="module" src="/src/admin/main.tsx"></script>
  </body>
</html>
